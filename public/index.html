
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera Room</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      justify-items: center;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    button {
      padding: 14px 22px;
      border: 0;
      border-radius: 10px;
      background: #38bdf8;
      font-size: 16px;
      cursor: pointer;
    }

    input {
      width: 280px;
      max-width: 80vw;
      padding: 10px;
      margin: 12px 0;
    }
  </style>
</head>
<body>
  <h1>📹 Camera Room</h1>
  <p>Создай комнату для тестирования видеосвязи.</p>
  <button id="create">Создать комнату</button>
  <div id="result"></div>

  <script>
    document.getElementById("create").onclick = async () => {
      const result = document.getElementById("result");

      try {
        const response = await fetch("/create-room");
        const data = await response.json();
        const link = location.origin + "/?room=" + data.room;

        result.replaceChildren();

        const input = document.createElement("input");
        input.value = link;
        input.readOnly = true;

        const copy = document.createElement("button");
        copy.textContent = "Копировать ссылку";
        copy.onclick = async () => {
          try {
            await navigator.clipboard.writeText(link);
            copy.textContent = "Скопировано!";
          } catch {
            input.select();
            document.execCommand("copy");
          }
        };

        result.append(input, document.createElement("br"), copy);
      } catch {
        result.textContent = "Ошибка создания комнаты";
      }
    };
  </script>
</body>
</html>
