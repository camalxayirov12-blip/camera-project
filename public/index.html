```html
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera Room</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 { margin-top: 28px; }

    p { color: #cbd5e1; line-height: 1.5; }

    button, input {
      width: 100%;
      max-width: 360px;
      padding: 13px;
      margin: 7px 0;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      background: #38bdf8;
      color: #082f49;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input { background: white; }

    .videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 900px;
      margin-top: 24px;
    }

    .video-box {
      background: #1e293b;
      border-radius: 14px;
      padding: 12px;
      overflow: hidden;
    }

    video {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #020617;
      border-radius: 9px;
    }

    #status {
      max-width: 600px;
      overflow-wrap: anywhere;
    }

    .note {
      max-width: 600px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>📹 Camera Room</h1>
  <p>Видеосвязь между телефоном и компьютером</p>

  <button id="create">Создать комнату</button>
  <input id="roomLink" placeholder="Или вставь ссылку на комнату">
  <button id="join">Войти в комнату</button>
  <button id="copy" hidden>Копировать ссылку</button>

  <p id="status" role="status">Создай комнату или войди по ссылке.</p>

  <p class="note">
    Камера включается только после твоего нажатия и разрешения браузера.
    Видео передаётся другому участнику комнаты. Не отправляй ссылку незнакомым.
  </p>

  <button id="startCamera" disabled>Включить камеру и передавать видео</button>
  <button id="stopCamera" disabled>Остановить камеру</button>

  <div class="videos">
    <div class="video-box">
      <p>Твоя камера</p>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="video-box">
      <p>Видео собеседника</p>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const createButton = document.getElementById("create");
    const joinButton = document.getElementById("join");
    const startButton = document.getElementById("startCamera");
    const stopButton = document.getElementById("stopCamera");
    const roomInput = document.getElementById("roomLink");
    const copyButton = document.getElementById("copy");
    const statusText = document.getElementById("status");
    const localVideo = document.getElementById("localVideo");
    const remoteVideo = document.getElementById("remoteVideo");

    let roomId = new URLSearchParams(location.search).get("room");
    let localStream = null;
    let peer = null;
    let joined = false;
    let pendingCandidates = [];
    let makingOffer = false;
    let polite = false;
    let remoteDescriptionSet = false;

    const rtcConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" }
      ]
    };

    function status(message) {
      statusText.textContent = message;
    }

    function showRoom(room) {
      roomId = room;
      const link = location.origin + "/?room=" + encodeURIComponent(room);
      roomInput.value = link;
      copyButton.hidden = false;
      history.replaceState(null, "", "/?room=" + encodeURIComponent(room));
    }

    createButton.onclick = async () => {
      try {
        const response = await fetch("/create-room");
        if (!response.ok) throw new Error("Не удалось создать комнату");
        const data = await response.json();
        showRoom(data.room);
        await joinRoom();
      } catch (error) {
        status(error.message || "Ошибка создания комнаты");
      }
    };

    joinButton.onclick = async () => {
      const value = roomInput.value.trim();
      if (!value) {
        status("Вставь ссылку на комнату или открой ссылку, которую тебе отправили.");
        return;
      }

      try {
        const parsed = new URL(value, location.origin);
        const room = parsed.searchParams.get("room") || value;
        if (!/^[a-zA-Z0-9-]{1,100}$/.test(room)) {
          throw new Error("Неверная ссылка или номер комнаты.");
        }
        showRoom(room);
        await joinRoom();
      } catch (error) {
        status(error.message || "Не удалось войти в комнату.");
      }
    };

    copyButton.onclick = async () => {
      try {
        await navigator.clipboard.writeText(roomInput.value);
        status("Ссылка скопирована. Отправь её собеседнику.");
      } catch {
        roomInput.select();
        status("Выдели ссылку и скопируй её вручную.");
      }
    };

    async function joinRoom() {
      if (joined) return;

      socket.emit("join-room", roomId, (response) => {
        if (!response || !response.success) {
          status(response?.message || "Не удалось войти в комнату.");
          return;
        }

        joined = true;
        polite = Boolean(response.polite);
        startButton.disabled = false;
        status("Ты в комнате. Отправь ссылку второму участнику. Для передачи видео нажми кнопку включения камеры.");
      });
    }

    if (roomId) {
      roomInput.value = location.href;
      joinRoom();
    }

    function createPeer() {
      if (peer) return peer;

      peer = new RTCPeerConnection(rtcConfig);

      peer.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit("signal", {
            room: roomId,
            data: { candidate: event.candidate }
          });
        }
      };

      peer.ontrack = (event) => {
        if (event.streams && event.streams[0]) {
          remoteVideo.srcObject = event.streams[0];
          status("Видео собеседника подключено.");
        }
      };

      peer.onconnectionstatechange = () => {
        if (peer && ["failed", "disconnected"].includes(peer.connectionState)) {
          status("Соединение прервано. Попробуйте подключиться ещё раз.");
        }
      };

      peer.onnegotiationneeded = async () => {
        try {
          makingOffer = true;
          await peer.setLocalDescription();
          socket.emit("signal", {
            room: roomId,
            data: { description: peer.localDescription }
          });
        } catch (error) {
          status("Ошибка настройки видеосвязи: " + error.message);
        } finally {
          makingOffer = false;
        }
      };

      return peer;
    }

    startButton.onclick = async () => {
      if (!joined) {
        status("Сначала войди в комнату.");
        return;
      }

      startButton.disabled = true;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: true
        });

        localVideo.srcObject = localStream;
        const connection = createPeer();

        localStream.getTracks().forEach(track => {
          connection.addTrack(track, localStream);
        });

        stopButton.disabled = false;
        status("Камера включена. Видео передаётся участнику комнаты.");
      } catch (error) {
        startButton.disabled = false;
        status(
          error.name === "NotAllowedError"
            ? "Доступ к камере или микрофону запрещён. Разреши его в браузере."
            : "Не удалось включить камеру: " + error.message
        );
      }
    };

    stopButton.onclick = () => {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }

      localVideo.srcObject = null;
      if (peer) {
        peer.close();
        peer = null;
      }

      remoteVideo.srcObject = null;
      pendingCandidates = [];
      remoteDescriptionSet = false;
      startButton.disabled = !joined;
      stopButton.disabled = true;

      socket.emit("signal", {
        room: roomId,
        data: { stopped: true }
      });

      status("Камера остановлена.");
    };

    socket.on("signal", async (message) => {
      try {
        if (!message || !message.data) return;

        const data = message.data;

        if (data.stopped) {
          remoteVideo.srcObject = null;
          status("Собеседник остановил передачу видео.");
          return;
        }

        const connection = createPeer();

        if (data.description) {
          const description = data.description;
          const offerCollision =
            description.type === "offer" &&
            (makingOffer || connection.signalingState !== "stable");

          if (offerCollision && !polite) return;

          await connection.setRemoteDescription(description);
          remoteDescriptionSet = true;

          for (const candidate of pendingCandidates) {
            await connection.addIceCandidate(candidate);
          }
          pendingCandidates = [];

          if (description.type === "offer") {
            await connection.setLocalDescription();
            socket.emit("signal", {
              room: roomId,
              data: { description: connection.localDescription }
            });
          }
        } else if (data.candidate) {
          if (remoteDescriptionSet) {
            await connection.addIceCandidate(data.candidate);
          } else {
            pendingCandidates.push(data.candidate);
          }
        }
      } catch (error) {
        status("Ошибка соединения: " + error.message);
      }
    });

    socket.on("connect_error", () => {
      status("Нет связи с сервером. Обнови страницу и попробуй снова.");
    });
  </script>
</body>
</html>
